<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('좌석관리 시스템', '/css/seat.css')}"></head>
<body class="seat-page">

<header class="app-header">
    <div class="container">
        <h1 class="app-title"><i class="fas fa-desktop"></i> 좌석관리 시스템</h1>
        <div class="header-actions">
            <span class="live-indicator" id="liveIndicator" th:if="${currentBatch != null}">
                실시간 업데이트 <span class="live-dot"></span>
            </span>
            <a class="btn btn-primary" th:href="@{/students(batchName=${currentBatch?.name})}">
                <i class="fas fa-users"></i> 수강생 관리
            </a>
        </div>
    </div>
</header>

<main class="container page-main">
    <section class="card toolbar">
        <div class="toolbar-row">
            <div class="batch-picker">
                <label class="form-label" for="batchSelect">기수 선택</label>
                <select id="batchSelect" class="form-control" th:disabled="${batches.isEmpty()}">
                    <option th:if="${batches.isEmpty()}" value="">등록된 기수가 없습니다</option>
                    <option th:each="b : ${batches}" th:value="${b.name}" th:text="${b.name}"
                            th:selected="${currentBatch != null and b.id == currentBatch.id}">기수</option>
                </select>
            </div>
            <div class="toolbar-buttons" th:if="${currentBatch != null}">
                <button type="button" class="btn btn-info" id="alphaToggleBtn">
                    <i class="fas fa-sort-alpha-down"></i> <span>가나다순 보기</span>
                </button>
                <button type="button" class="btn btn-indigo" id="roomStatusBtn">
                    <i class="fas fa-door-open"></i> 회의실 현황 <span class="count-pill" id="roomCount">0</span>
                </button>
                <button type="button" class="btn btn-secondary" id="historyBtn">
                    <i class="fas fa-history"></i> 출입 히스토리
                </button>
                <button type="button" class="btn btn-primary" id="lunchBtn">
                    <i class="fas fa-utensils"></i> 점심시간
                </button>
                <button type="button" class="btn btn-danger" id="bulkExitBtn">
                    <i class="fas fa-sign-out-alt"></i> 전체 퇴실
                </button>
            </div>
        </div>
        <div class="legend-wrap" th:if="${currentBatch != null}">
            <button type="button" class="legend-toggle" id="legendToggle" aria-expanded="false">
                <i class="fas fa-palette"></i> 범례 <i class="fas fa-chevron-down"></i>
            </button>
            <ul class="legend" id="legend"></ul>
        </div>
    </section>

    <section class="card" th:if="${currentBatch == null}">
        <div class="empty-state">
            <i class="fas fa-layer-group"></i>
            <p>등록된 기수가 없습니다.</p>
            <a class="btn btn-primary" th:href="@{/students}"><i class="fas fa-users"></i> 수강생 관리에서 기수 추가하기</a>
        </div>
    </section>

    <th:block th:if="${currentBatch != null}">
        <section class="card seat-map-card">
            <div class="classroom-screen"><i class="fas fa-desktop"></i> 강의실 스크린</div>
            <div class="seat-grid-scroll">
                <div class="seat-grid" id="seatGrid" aria-label="좌석 배치도"></div>
            </div>
            <div class="empty-state" id="seatEmpty" hidden>
                <i class="fas fa-chair"></i>
                <p>배치된 수강생이 없습니다. 수강생 관리에서 수강생을 등록해주세요.</p>
            </div>
        </section>

        <section class="card" id="alphaSection" hidden>
            <h2 class="card-title"><i class="fas fa-sort-alpha-down" style="color: var(--info)"></i>
                <span id="alphaTitle">가나다순 정렬 보기 (0명)</span></h2>
            <div class="alpha-grid" id="alphaGrid"></div>
        </section>
    </th:block>
</main>

<footer class="status-bar" th:if="${currentBatch != null}">
    <div class="container">
        <span><i class="far fa-clock"></i> 마지막 업데이트: <strong id="lastUpdated">-</strong></span>
        <span class="auto-refresh"><i class="fas fa-sync-alt"></i> 자동 새로고침 활성화</span>
    </div>
</footer>

<!-- 좌석 메뉴 -->
<div class="modal-backdrop" id="seatMenuModal" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true" aria-labelledby="seatMenuTitle">
        <div class="modal-header">
            <h3 id="seatMenuTitle"><i class="fas fa-user"></i> <span id="seatMenuName"></span></h3>
            <button type="button" class="icon-btn" data-close aria-label="닫기"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="status-menu" id="statusMenu"></div>
            <div class="meeting-section">
                <h4><i class="fas fa-door-open"></i> 회의실</h4>
                <p class="meeting-current" id="meetingCurrent"></p>
                <button type="button" class="btn btn-indigo" id="meetingEnterBtn"><i class="fas fa-sign-in-alt"></i> 입장하기</button>
                <button type="button" class="btn btn-ghost" id="meetingExitBtn"><i class="fas fa-sign-out-alt"></i> 퇴장</button>
            </div>
        </div>
    </div>
</div>

<!-- 회의실 선택 -->
<div class="modal-backdrop" id="roomSelectModal" hidden>
    <div class="modal modal-sm" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3><i class="fas fa-door-open"></i> 회의실 선택</h3>
            <button type="button" class="icon-btn" data-close aria-label="닫기"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="room-select" id="roomSelect"></div>
        </div>
    </div>
</div>

<!-- 회의실 현황 -->
<div class="modal-backdrop" id="roomStatusModal" hidden>
    <div class="modal modal-lg" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3><i class="fas fa-door-open"></i> 회의실 현황</h3>
            <button type="button" class="icon-btn" data-close aria-label="닫기"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <div class="room-cards" id="roomCards"></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-danger" id="exitAllRoomsBtn"><i class="fas fa-sign-out-alt"></i> 전체 회의실 퇴장</button>
        </div>
    </div>
</div>

<!-- 출입 히스토리 -->
<div class="modal-backdrop" id="historyModal" hidden>
    <div class="modal modal-xl" role="dialog" aria-modal="true">
        <div class="modal-header">
            <h3><i class="fas fa-history"></i> 출입 히스토리</h3>
            <button type="button" class="icon-btn" data-close aria-label="닫기"><i class="fas fa-times"></i></button>
        </div>
        <div class="modal-body">
            <form class="history-filters" id="historyForm" novalidate>
                <div>
                    <label class="form-label" for="hBatch">기수</label>
                    <select class="form-control" id="hBatch"></select>
                </div>
                <div>
                    <label class="form-label" for="hName">수강생명</label>
                    <input type="text" class="form-control" id="hName" placeholder="이름 검색" autocomplete="off">
                </div>
                <div>
                    <label class="form-label" for="hStart">시작일시</label>
                    <input type="datetime-local" class="form-control" id="hStart">
                </div>
                <div>
                    <label class="form-label" for="hEnd">종료일시</label>
                    <input type="datetime-local" class="form-control" id="hEnd">
                </div>
                <div class="history-actions">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-search"></i> 검색</button>
                    <button type="button" class="btn btn-ghost" id="historyReset"><i class="fas fa-undo"></i> 초기화</button>
                    <button type="button" class="btn btn-success" id="historyExport"><i class="fas fa-file-excel"></i> 엑셀 내보내기</button>
                </div>
            </form>
            <div class="table-wrap">
                <table class="history-table">
                    <thead>
                    <tr><th>번호</th><th>수강생명</th><th>기수</th><th>상태변경</th><th>변경시간</th></tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
            <div class="pagination">
                <button type="button" class="btn btn-ghost btn-sm" id="historyPrev"><i class="fas fa-chevron-left"></i> 이전</button>
                <span id="historyPageInfo">1 / 1 페이지 (총 0건)</span>
                <button type="button" class="btn btn-ghost btn-sm" id="historyNext">다음 <i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: confirm-modal}"></div>
<div th:replace="~{fragments/layout :: toast-container}"></div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/seat.js}"></script>
</body>
</html>
